<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Leaderboard - ABTalks 60-Day Tech Challenge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#ffc640",
                        "secondary-container": "#e0a100",
                        "surface-container-high": "#2a2a2c",
                        "surface-container-highest": "#353437",
                        "on-surface-variant": "#e0c0b1",
                        "on-background": "#e5e1e4",
                        "tertiary": "#c0c1ff",
                        "primary": "#ffb690",
                        "primary-container": "#f97316",
                        "on-primary": "#552100",
                        "surface": "#131315",
                        "surface-variant": "#232325"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono", "monospace"],
                        "display-sm": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <style>
        :root { --bg-color: #0b0b0d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100dvh; background-color: var(--bg-color); color: #e5e1e4; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(22, 22, 26, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .glass-nav { background: rgba(13, 13, 16, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .material-symbols-outlined { font-display: block; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="relative flex justify-center items-center min-h-screen bg-[#070709]">

<div class="w-full max-w-[420px] min-h-screen relative z-10 flex flex-col bg-[#0b0b0d] border-x border-white/5 shadow-2xl">

    <!-- Header -->
    <header class="sticky top-0 w-full z-50 glass-nav flex items-center justify-between px-4 h-16">
        <div class="flex items-center gap-2.5">
            <span class="material-symbols-outlined text-secondary text-2xl">emoji_events</span>
            <div class="flex flex-col">
                <span class="font-display-sm text-sm font-extrabold tracking-tight text-white">Leaderboard</span>
                <span class="text-[9px] font-code-sm text-on-surface-variant/70 tracking-widest uppercase">Global Builder Rankings</span>
            </div>
        </div>

        <div class="text-[10px] font-code-sm text-secondary bg-secondary/10 px-2.5 py-1 rounded-full border border-secondary/20 font-bold">
            TOP 10
        </div>
    </header>

    <main class="flex-1 px-4 pt-5 pb-28 flex flex-col gap-3">

        <!-- Top Builder Item -->
        <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border-l-4 border-l-amber-400">
            <div class="flex items-center gap-3">
                <span class="text-sm font-code-sm font-black text-amber-400 w-5">#1</span>
                <div class="w-8 h-8 rounded-full bg-amber-400/20 border border-amber-400/40 flex items-center justify-center font-code-sm font-bold text-amber-300 text-xs">
                    AK
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-white">Alex K.</span>
                    <span class="text-[10px] font-code-sm text-on-surface-variant/70">12 Days Completed • 12 🔥</span>
                </div>
            </div>
            <span class="text-xs font-code-sm font-bold text-amber-400">1,350 PTS</span>
        </div>

        <!-- #2 -->
        <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border-l-4 border-l-slate-300">
            <div class="flex items-center gap-3">
                <span class="text-sm font-code-sm font-black text-slate-300 w-5">#2</span>
                <div class="w-8 h-8 rounded-full bg-slate-300/20 border border-slate-300/40 flex items-center justify-center font-code-sm font-bold text-slate-200 text-xs">
                    SM
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-white">Sarah M.</span>
                    <span class="text-[10px] font-code-sm text-on-surface-variant/70">12 Days Completed • 12 🔥</span>
                </div>
            </div>
            <span class="text-xs font-code-sm font-bold text-slate-300">1,300 PTS</span>
        </div>

        <!-- #3 User Dynamic Position -->
        <div id="user-rank-card" class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border-l-4 border-l-amber-600 bg-primary/10">
            <div class="flex items-center gap-3">
                <span id="user-rank" class="text-sm font-code-sm font-black text-primary w-5">#3</span>
                <div class="w-8 h-8 rounded-full bg-primary/20 border border-primary/40 flex items-center justify-center font-code-sm font-bold text-primary text-xs">
                    YOU
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-white">You (Challenger)</span>
                    <span id="user-desc" class="text-[10px] font-code-sm text-on-surface-variant/70">11 Days Completed • 11 🔥</span>
                </div>
            </div>
            <span id="user-pts" class="text-xs font-code-sm font-bold text-secondary">1,200 PTS</span>
        </div>

    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[420px] glass-nav h-16 z-50 border-t border-white/10 grid grid-cols-3 items-center text-center">
        <a href="/dashboard" class="flex flex-col items-center gap-1 text-on-surface-variant/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-[9px] font-code-sm uppercase">Dashboard</span>
        </a>
        <a href="/dashboard/leaderboard" class="flex flex-col items-center gap-1 text-primary">
            <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
            <span class="text-[9px] font-code-sm font-bold uppercase">Leaderboard</span>
        </a>
        <a href="/dashboard/submissions" class="flex flex-col items-center gap-1 text-on-surface-variant/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">history</span>
            <span class="text-[9px] font-code-sm uppercase">History</span>
        </a>
    </nav>
</div>

<script>
    if (sessionStorage.getItem('day12_submitted') === 'true') {
        document.getElementById('user-rank').innerText = '#2';
        document.getElementById('user-desc').innerText = '12 Days Completed • 12 🔥';
        document.getElementById('user-pts').innerText = '1,300 PTS';
    }
</script>

</body>
</html>
