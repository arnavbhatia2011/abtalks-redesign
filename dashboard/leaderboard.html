<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Leaderboard - ABTalks 60-Day Tech Challenge</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#ffc640",
                        "primary": "#ffb690",
                        "primary-container": "#f97316",
                        "on-surface-variant": "#e0c0b1",
                        "surface": "#131315"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono", "monospace"],
                        "display-sm": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700" rel="stylesheet"/>

    <style>
        :root { --bg-color: #0b0b0d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100dvh; background-color: var(--bg-color); color: #e5e1e4; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(22, 22, 26, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .glass-nav { background: rgba(13, 13, 16, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="relative flex justify-center items-center min-h-screen bg-[#070709]">

<div class="w-full max-w-[420px] min-h-screen relative z-10 flex flex-col bg-[#0b0b0d] border-x border-white/5 shadow-2xl">

    <!-- Header -->
    <header class="sticky top-0 w-full z-50 glass-nav flex items-center justify-between px-4 h-16">
        <a href="/dashboard" class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center">
                <span class="material-symbols-outlined text-primary text-lg">arrow_back</span>
            </div>
            <div class="flex flex-col">
                <span class="font-display-sm text-sm font-extrabold tracking-tight bg-gradient-to-r from-white via-primary to-secondary bg-clip-text text-transparent">Global Leaderboard</span>
                <span class="text-[9px] font-code-sm text-on-surface-variant/70 tracking-widest uppercase">Global Builders</span>
            </div>
        </a>
    </header>

    <main class="flex-1 px-4 pt-5 pb-28 flex flex-col gap-4">
        <!-- Top 3 Podium -->
        <div class="grid grid-cols-3 gap-2.5 my-2 items-end">
            <!-- Rank 2 -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col items-center text-center border-white/10">
                <span class="text-lg">🥈</span>
                <span class="text-xs font-bold text-white mt-1">Aarav K.</span>
                <span class="text-[10px] font-code-sm text-secondary font-bold">1,280 PTS</span>
            </div>
            <!-- Rank 1 -->
            <div class="glass-panel p-4 rounded-2xl flex flex-col items-center text-center border-amber-400/40 bg-gradient-to-b from-amber-400/10 to-transparent -translate-y-2">
                <span class="text-2xl">👑</span>
                <span class="text-xs font-extrabold text-white mt-1">DevX</span>
                <span class="text-[11px] font-code-sm text-amber-400 font-extrabold">1,350 PTS</span>
            </div>
            <!-- Rank 3 -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col items-center text-center border-white/10">
                <span class="text-lg">🥉</span>
                <span class="text-xs font-bold text-white mt-1">Rohan M.</span>
                <span class="text-[10px] font-code-sm text-secondary font-bold">1,250 PTS</span>
            </div>
        </div>

        <!-- User Highlight Card -->
        <div class="text-[10px] font-code-sm text-on-surface-variant/70 uppercase tracking-wider px-1">Your Standing</div>
        
        <div id="user-rank-card" class="glass-panel p-4 rounded-2xl flex items-center justify-between border-primary/40 bg-primary/10 shadow-lg shadow-primary/5">
            <div class="flex items-center gap-3.5">
                <span id="lb-user-rank" class="text-base font-extrabold font-code-sm text-primary bg-primary/20 px-2.5 py-1 rounded-lg border border-primary/30">#14</span>
                <div class="flex flex-col">
                    <span class="text-xs font-extrabold text-white flex items-center gap-1.5">
                        You (ABTalks)
                        <span class="text-[9px] font-code-sm text-emerald-400 font-normal bg-emerald-400/10 px-1.5 py-0.5 rounded border border-emerald-400/20">YOU</span>
                    </span>
                    <span id="lb-user-streak" class="text-[10px] font-code-sm text-on-surface-variant/70">11-Day Streak 🔥</span>
                </div>
            </div>
            <span id="lb-user-points" class="text-xs font-code-sm font-extrabold text-secondary bg-black/40 px-3 py-1.5 rounded-xl border border-white/5">1,200 PTS</span>
        </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[420px] glass-nav h-16 z-50 border-t border-white/10 grid grid-cols-3 items-center text-center">
        <a href="/dashboard" class="flex flex-col items-center gap-1 text-on-surface-variant/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-[9px] font-code-sm uppercase">Dashboard</span>
        </a>
        <a href="/dashboard/leaderboard" class="flex flex-col items-center gap-1 text-primary">
            <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
            <span class="text-[9px] font-code-sm font-bold uppercase">Leaderboard</span>
        </a>
        <a href="/dashboard/submissions" class="flex flex-col items-center gap-1 text-on-surface-variant/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">history</span>
            <span class="text-[9px] font-code-sm uppercase">History</span>
        </a>
    </nav>
</div>

<script>
    const isSubmitted = sessionStorage.getItem('day12_submitted') === 'true';

    if (isSubmitted) {
        document.getElementById('lb-user-rank').innerText = '#12';
        document.getElementById('lb-user-streak').innerText = '12-Day Streak 🔥';
        document.getElementById('lb-user-points').innerText = '1,300 PTS';
    }
</script>

</body>
</html>
