<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Leaderboard - ABTalks 60-Day Tech Challenge</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#ffc640",
                        "primary": "#ffb690",
                        "primary-container": "#f97316",
                        "on-primary": "#552100",
                        "on-surface-variant": "#e0c0b1",
                        "surface": "#131315"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono", "monospace"],
                        "display-sm": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700" rel="stylesheet"/>

    <style>
        :root { --bg-color: #131315; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100dvh; background-color: var(--bg-color); color: #e5e1e4; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(25, 25, 28, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(19, 19, 21, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="relative flex justify-center items-center min-h-screen">

<div class="w-full max-w-[420px] min-h-screen relative z-10 flex flex-col bg-[#131315] border-x border-white/5 shadow-2xl">

    <header class="sticky top-0 w-full z-50 glass-nav flex items-center justify-between px-4 h-16">
        <a href="/dashboard" class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-xl">arrow_back</span>
            <div class="flex flex-col">
                <span class="font-display-sm text-sm font-extrabold tracking-tight bg-gradient-to-r from-white via-primary to-secondary bg-clip-text text-transparent">ABTalks Leaderboard</span>
                <span class="text-[8px] font-code-sm text-on-surface-variant/70 tracking-widest -mt-1 uppercase">Top Builders</span>
            </div>
        </a>
    </header>

    <main class="flex-1 px-4 pt-5 pb-24 flex flex-col gap-3">
        <!-- Top 3 Static -->
        <div class="grid grid-cols-3 gap-2 mb-2">
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center text-center">
                <span class="text-xs font-bold text-amber-300">#2</span>
                <span class="text-xs font-bold text-white mt-1">Aarav K.</span>
                <span class="text-[10px] font-code-sm text-secondary">1,280 PTS</span>
            </div>
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center text-center border-amber-400/40 bg-amber-400/5">
                <span class="text-xs font-bold text-amber-400">#1 👑</span>
                <span class="text-xs font-bold text-white mt-1">DevX</span>
                <span class="text-[10px] font-code-sm text-secondary">1,350 PTS</span>
            </div>
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center text-center">
                <span class="text-xs font-bold text-amber-600">#3</span>
                <span class="text-xs font-bold text-white mt-1">Rohan M.</span>
                <span class="text-[10px] font-code-sm text-secondary">1,250 PTS</span>
            </div>
        </div>

        <!-- User Rank Card -->
        <div id="user-rank-card" class="glass-panel p-3 rounded-xl flex items-center justify-between border-primary/30 bg-primary/5">
            <div class="flex items-center gap-3">
                <span id="lb-user-rank" class="text-sm font-bold font-code-sm text-primary">#14</span>
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-white">You (ABTalks)</span>
                    <span id="lb-user-streak" class="text-[9px] font-code-sm text-on-surface-variant/70">11-Day Streak 🔥</span>
                </div>
            </div>
            <span id="lb-user-points" class="text-xs font-code-sm font-bold text-secondary">1,200 PTS</span>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full max-w-[420px] glass-nav h-16 z-50 border-t border-white/10 grid grid-cols-3 items-center text-center">
        <a href="/dashboard" class="flex flex-col items-center gap-0.5 text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-[9px] font-code-sm uppercase">Dashboard</span>
        </a>
        <a href="/dashboard/leaderboard" class="flex flex-col items-center gap-0.5 text-primary">
            <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
            <span class="text-[9px] font-code-sm font-bold uppercase">Leaderboard</span>
        </a>
        <a href="/dashboard/submissions" class="flex flex-col items-center gap-0.5 text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">history</span>
            <span class="text-[9px] font-code-sm uppercase">History</span>
        </a>
    </nav>
</div>

<script>
    const isSubmitted = sessionStorage.getItem('day12_submitted') === 'true';

    if (isSubmitted) {
        document.getElementById('lb-user-rank').innerText = '#12';
        document.getElementById('lb-user-streak').innerText = '12-Day Streak 🔥';
        document.getElementById('lb-user-points').innerText = '1,300 PTS';
    }
</script>

</body>
</html>
