<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Submit Day 12 - ABTalks 60-Day Tech Challenge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#ffc640",
                        "secondary-container": "#e0a100",
                        "surface-container-high": "#2a2a2c",
                        "surface-container-highest": "#353437",
                        "on-surface-variant": "#e0c0b1",
                        "on-background": "#e5e1e4",
                        "tertiary": "#c0c1ff",
                        "primary": "#ffb690",
                        "primary-container": "#f97316",
                        "on-primary": "#552100",
                        "surface": "#131315",
                        "surface-variant": "#232325"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono", "monospace"],
                        "display-sm": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <style>
        :root { --bg-color: #0b0b0d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100dvh; background-color: var(--bg-color); color: #e5e1e4; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(22, 22, 26, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .glass-card-glow { background: linear-gradient(135deg, rgba(25, 25, 30, 0.9), rgba(18, 18, 22, 0.8)); backdrop-filter: blur(28px); border: 1px solid rgba(249, 115, 22, 0.3); box-shadow: 0 0 35px -5px rgba(249, 115, 22, 0.25), 0 8px 32px 0 rgba(0, 0, 0, 0.6); }
        .glass-nav { background: rgba(13, 13, 16, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .material-symbols-outlined { font-display: block; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="relative flex justify-center items-center min-h-screen bg-[#070709]">

<div class="w-full max-w-[420px] min-h-screen relative z-10 flex flex-col bg-[#0b0b0d] border-x border-white/5 shadow-2xl">

    <!-- Header -->
    <header class="sticky top-0 w-full z-50 glass-nav flex items-center justify-between px-4 h-16">
        <a href="/dashboard" class="flex items-center gap-2.5 cursor-pointer group">
            <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined text-primary text-lg">arrow_back</span>
            </div>
            <div class="flex flex-col">
                <span class="font-display-sm text-sm font-extrabold tracking-tight bg-gradient-to-r from-white via-primary to-secondary bg-clip-text text-transparent">Submit Work</span>
                <span class="text-[9px] font-code-sm text-on-surface-variant/70 tracking-widest uppercase">Day 12 • LRU Cache</span>
            </div>
        </a>

        <div class="text-[10px] font-code-sm text-secondary bg-secondary/10 px-2.5 py-1 rounded-full border border-secondary/20 font-bold">
            +100 PTS
        </div>
    </header>

    <main class="flex-1 px-4 pt-5 pb-12 flex flex-col gap-5">

        <form id="submission-form" class="glass-card-glow p-5 rounded-2xl flex flex-col gap-4">
            <div class="flex flex-col gap-1 border-b border-white/10 pb-3">
                <h2 class="text-base font-extrabold text-white">Proof of Work</h2>
                <p class="text-xs text-on-surface-variant/70">Submit your repo and live project link to claim today's points.</p>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-code-sm font-bold text-white flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-primary text-sm">code</span>
                    GitHub Repository URL *
                </label>
                <input type="url" id="gh-input" required placeholder="https://github.com/username/lru-cache" class="bg-black/60 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary font-code-sm"/>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-code-sm font-bold text-white flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-primary text-sm">language</span>
                    Live Demo / Vercel URL *
                </label>
                <input type="url" id="deploy-input" required placeholder="https://lru-cache-demo.vercel.app" class="bg-black/60 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary font-code-sm"/>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-code-sm font-bold text-white flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-primary text-sm">share</span>
                    LinkedIn Post URL (Optional)
                </label>
                <input type="url" id="li-input" placeholder="https://linkedin.com/posts/..." class="bg-black/60 border border-white/15 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-on-surface-variant/40 focus:outline-none focus:border-primary font-code-sm"/>
            </div>

            <button type="submit" class="mt-2 w-full py-3 bg-gradient-to-r from-primary-container to-secondary text-black font-code-sm font-extrabold text-xs uppercase tracking-wider rounded-xl flex items-center justify-center gap-2 shadow-lg hover:brightness-110 transition-all">
                <span class="material-symbols-outlined text-base">check_circle</span>
                Complete Day 12
            </button>
        </form>

    </main>
</div>

<script>
    document.getElementById('submission-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const gh = document.getElementById('gh-input').value;
        const deploy = document.getElementById('deploy-input').value;
        const li = document.getElementById('li-input').value;

        sessionStorage.setItem('day12_submitted', 'true');
        sessionStorage.setItem('gh_url', gh);
        sessionStorage.setItem('deploy_url', deploy);
        if (li) sessionStorage.setItem('li_url', li);

        window.location.href = '/dashboard';
    });
</script>

</body>
</html>
