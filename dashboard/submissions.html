<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Submissions - ABTalks 60-Day Tech Challenge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#ffc640",
                        "secondary-container": "#e0a100",
                        "surface-container-high": "#2a2a2c",
                        "surface-container-highest": "#353437",
                        "on-surface-variant": "#e0c0b1",
                        "on-background": "#e5e1e4",
                        "tertiary": "#c0c1ff",
                        "primary": "#ffb690",
                        "primary-container": "#f97316",
                        "on-primary": "#552100",
                        "surface": "#131315",
                        "surface-variant": "#232325"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono", "monospace"],
                        "display-sm": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <style>
        :root { --bg-color: #0b0b0d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100dvh; background-color: var(--bg-color); color: #e5e1e4; font-family: 'Geist', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(22, 22, 26, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .glass-nav { background: rgba(13, 13, 16, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .material-symbols-outlined { font-display: block; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="relative flex justify-center items-center min-h-screen bg-[#070709]">

<div class="w-full max-w-[420px] min-h-screen relative z-10 flex flex-col bg-[#0b0b0d] border-x border-white/5 shadow-2xl">

    <!-- Header -->
    <header class="sticky top-0 w-full z-50 glass-nav flex items-center justify-between px-4 h-16">
        <div class="flex items-center gap-2.5">
            <span class="material-symbols-outlined text-primary text-2xl">history</span>
            <div class="flex flex-col">
                <span class="font-display-sm text-sm font-extrabold tracking-tight text-white">Submission History</span>
                <span class="text-[9px] font-code-sm text-on-surface-variant/70 tracking-widest uppercase">Verified Proofs</span>
            </div>
        </div>
    </header>

    <main class="flex-1 px-4 pt-5 pb-28 flex flex-col gap-3" id="submission-list">

        <!-- Day 12 Card (Rendered via JS if submitted) -->
        <div id="day12-history-card" class="hidden glass-panel p-4 rounded-2xl flex flex-col gap-2 border-l-4 border-l-emerald-400">
            <div class="flex items-center justify-between">
                <span class="text-[10px] font-code-sm font-bold text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20">DAY 12 • VERIFIED</span>
                <span class="text-xs font-code-sm font-bold text-secondary">+100 PTS</span>
            </div>
            <h3 class="text-sm font-bold text-white">LRU Cache Architecture</h3>
            <div class="flex flex-wrap gap-2 pt-1">
                <a id="history-gh-link" href="#" target="_blank" class="text-[10px] font-code-sm bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-primary flex items-center gap-1 hover:bg-white/10">
                    <span class="material-symbols-outlined text-xs">code</span> GitHub Repo
                </a>
                <a id="history-deploy-link" href="#" target="_blank" class="text-[10px] font-code-sm bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-secondary flex items-center gap-1 hover:bg-white/10">
                    <span class="material-symbols-outlined text-xs">open_in_new</span> Live Demo
                </a>
            </div>
        </div>

        <!-- Day 11 -->
        <div class="glass-panel p-4 rounded-2xl flex flex-col gap-2 border-l-4 border-l-emerald-400">
            <div class="flex items-center justify-between">
                <span class="text-[10px] font-code-sm font-bold text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20">DAY 11 • VERIFIED</span>
                <span class="text-xs font-code-sm font-bold text-secondary">+100 PTS</span>
            </div>
            <h3 class="text-sm font-bold text-white">JWT Authentication Service</h3>
            <div class="flex flex-wrap gap-2 pt-1">
                <span class="text-[10px] font-code-sm bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-on-surface-variant/70 flex items-center gap-1">
                    <span class="material-symbols-outlined text-xs">check_circle</span> Verified
                </span>
            </div>
        </div>

    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[420px] glass-nav h-16 z-50 border-t border-white/10 grid grid-cols-3 items-center text-center">
        <a href="/dashboard" class="flex flex-col items-center gap-1 text-on-surface-variant/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-[9px] font-code-sm uppercase">Dashboard</span>
        </a>
        <a href="/dashboard/leaderboard" class="flex flex-col items-center gap-1 text-on-surface-variant/70 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-xl">emoji_events</span>
            <span class="text-[9px] font-code-sm uppercase">Leaderboard</span>
        </a>
        <a href="/dashboard/submissions" class="flex flex-col items-center gap-1 text-primary">
            <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">history</span>
            <span class="text-[9px] font-code-sm font-bold uppercase">History</span>
        </a>
    </nav>
</div>

<script>
    if (sessionStorage.getItem('day12_submitted') === 'true') {
        const card = document.getElementById('day12-history-card');
        card.classList.remove('hidden');

        const gh = sessionStorage.getItem('gh_url');
        const deploy = sessionStorage.getItem('deploy_url');

        if (gh) document.getElementById('history-gh-link').href = gh;
        if (deploy) document.getElementById('history-deploy-link').href = deploy;
    }
</script>

</body>
</html>
